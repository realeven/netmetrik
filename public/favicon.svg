  </defs>
  <rect width="64" height="64" rx="18" fill="url(#cyanGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" />
